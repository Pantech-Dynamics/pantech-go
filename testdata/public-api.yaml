      summary: Snapshot a database
      description: |-
        Takes a snapshot of the database's data disk. The engine keeps running, so the snapshot is **crash-consistent only**: what the disk held at that instant, as after a power cut, which the engine recovers from on start. It is not an engine-level backup; stop the database first for a quiesced copy. The database must be running or stopped.

        Billed like every snapshot: the storage rate on its physical size, for every started hour until it is deleted. A snapshot outlives its database and stays billed until you delete it. Restoring a database from a snapshot is not available yet.

        Returns `202 Accepted` with an `operation_id` (also in the `Location` header). The change happens in the background: poll `GET /public/v1/operations/{operation_id}`, or stream `/events`, until `status` is `succeeded` or `failed`; a failed operation carries a stable `failure.code` and a readable `failure.reason`. The new snapshot's id is the operation's `resource_id`.

        Send an `Idempotency-Key`. A retry with the same key returns the original operation instead of making the change twice.

        **Scope:** `write`.
      operationId: createDatabaseSnapshot
      security:
        - apiKey: []
      x-scope: write
      x-order: 104
      parameters:
        - name: database_id
          in: path
