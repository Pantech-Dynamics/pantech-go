    post:
      tags:
        - Instances
      summary: Create an instance
      description: |-
        Orders a new instance (VPS). Choose a plan (`GET /public/v1/plans`), an image (`GET /public/v1/images`) and an SSH key (`GET /public/v1/ssh-keys`), which is required: images have no password login.

        **Placement.** Leave out `subnet_id` for a standard instance with its own public IPv4, protected by a security group (your organization's default group unless you send `security_group_id`). Send `subnet_id` (and optionally its `network_id`) to place it in a VPC subnet, with a private address only; reach it through a public IP.

        **Paid first.** Returns `202 Accepted` with an order (`order_id`, also the `Location` header). The initial payment is taken from credit, or else from the organization's default card, and then the instance is provisioned. Follow `GET /public/v1/instance-orders/{order_id}` until `status` is `provisioned`, then read the instance; `payment_failed` and `failed` are final, and any payment taken is returned to your credit.

        **Idempotency.** Send an `Idempotency-Key`. A retry with the same key returns the original order instead of ordering a second instance.

        **Scope:** `write`.
      operationId: createInstance
      security:
        - apiKey: []
      x-scope: write
      x-order: 9
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        202:
          description: Ordered.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAccepted"
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented for this endpoint.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        402:
          description: |-
            `INSUFFICIENT_CREDIT`: the initial payment is more than your available credit and the organization has no default card; `detail` gives both amounts. Buy credit (`POST /public/v1/billing/credit/purchases`) or add a card in the console, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: `ssh_key_id` is not one of your SSH keys. Check it with `GET /public/v1/ssh-keys`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        409:
          description: |-
            `INSTANCE_NAME_TAKEN`: you already have an instance with this name. Choose a different name.
            `ACCOUNT_SUSPENDED`: an invoice is overdue, or the organization was suspended for non-payment. Pay the outstanding invoice in the console, then retry.
            `ACCOUNT_NOT_ACTIVE`: the organization's billing account is not active yet. Finish billing setup in the console (verify the organization and add a payment method), then retry.
            `PROVIDER_ACCOUNT_NOT_READY`: your organization's cloud account is still being set up, which takes a few minutes after sign-up. Retry shortly.
            `SECURITY_GROUPS_NOT_SUPPORTED_IN_ZONE`: a VPC instance uses its subnet's firewall rules, not a security group. Leave out `security_group_id`.
            `CONCURRENT_UPDATE`: the resource changed while this request was being processed. Retry the request; if it repeats, read the resource first.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        413:
          description: |-
            `REQUEST_TOO_LARGE`: the body is larger than 64 KiB. Send a smaller request.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        422:
          description: |-
            `VALIDATION_FAILED`: a field is invalid. Each entry of `errors` names the `field` and its `code`:
            `name` `REQUIRED` or `NAME_TOO_LONG`: send a name of 1 to 255 characters.
            `ssh_key_id` `REQUIRED`: no SSH key was sent. Send the id of one of your SSH keys (`GET /public/v1/ssh-keys`): images have no password login.
            `plan_slug` `PLAN_NOT_FOUND`: no active plan has this slug. Pick one from `GET /public/v1/plans`.
            `image_slug` `IMAGE_NOT_FOUND`: no active image has this slug. Pick one from `GET /public/v1/images`.
            `image_slug` `IMAGE_NOT_AVAILABLE_IN_ZONE`: the image does not run in the zone this instance goes to. Pick an image whose `zones` include it.
            `encrypted` `ENCRYPTION_NOT_SUPPORTED`: `encrypted` is `true` but this image has no encrypted version available to your organization. Choose an image that offers one, or send `false`.
            `encrypted` `ENCRYPTION_CONFLICT`: `encrypted` is `false` but `image_slug` is an encrypted image. Send `true`, or choose the plain image.
            `security_group_id` `SECURITY_GROUP_NOT_FOUND`: not one of your security groups. Check it with `GET /public/v1/security-groups`.
            `subnet_id` `SUBNET_REQUIRED`: `network_id` was sent without a subnet. Send the subnet too.
            `subnet_id` `SUBNET_NOT_IN_NETWORK`: the subnet is not in `network_id`. Send a subnet of that VPC, or leave out `network_id`.
            `subnet_id` `SUBNET_NOT_FOUND`: no subnet with this id in your organization.
            `subnet_id` `SUBNET_NOT_USABLE`: the subnet is being deleted or has failed. Use another subnet.
            `region` `REGION_NOT_AVAILABLE`: this region cannot take this instance. Pick one from `GET /public/v1/regions`.
            `UNKNOWN_FIELD`: the body has a field this endpoint does not take (named in `field`). Remove it or fix its spelling.
            `VALIDATION_FAILED` with no `errors` entry: the platform refused a value, for example a malformed CIDR or a name longer than 255 characters. Check the request against this page.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
            `PROVISIONING_UNAVAILABLE`: the provisioning service is temporarily unavailable. Wait a few seconds, then retry with the same `Idempotency-Key`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
