          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    Failure:
      type:
        - object
        - "null"
      description: "Why it failed, when it did; otherwise null."
      required:
        - code
        - reason
      properties:
        code:
          type: string
          description: "A stable failure code to branch on, e.g. `INSTANCE_BUSY`. Provisioning failures use `PROVISIONING_CAPACITY_UNAVAILABLE` (no capacity in the zone right now: try another plan or zone, or try later), `PROVISIONING_LIMIT_EXCEEDED` (an account limit was reached: delete unused resources or contact support), `PROVISIONING_ADDRESSES_EXHAUSTED` (no free addresses in the zone), `PROVISIONING_IMAGE_UNAVAILABLE` (the image is not ready), `PROVISIONING_RESOURCE_BUSY` (the resource was busy: try again once it settles), `PROVISIONING_RESOURCE_CONFLICT`, `PROVISIONING_RESOURCE_NOT_FOUND`, `PROVISIONING_INVALID_REQUEST`, `PROVISIONING_UNAVAILABLE` (temporarily unavailable: retry), `PROVISIONING_INTERNAL_ERROR` (a fault on our side: our team is alerted, and retrying will not help) and `PROVISIONING_FAILED` (anything else)."
          examples: ["INSTANCE_BUSY"]
        reason:
          type: string
          description: "A readable sentence saying what went wrong and what to do; safe to show to your users. Its wording may change: branch on `code`."
    FirewallRule:
