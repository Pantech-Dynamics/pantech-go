        amount_minor:
          type: integer
          format: int64
          description: "How much credit to buy, in minor units of your organization's currency: kobo for NGN, cents for USD."
    Receipt:
      type: object
      description: "A receipt for money that moved on your account. Amounts are integers in minor units of `currency`."
      required:
        - id
        - number
        - kind
        - issuer_name
        - currency
        - amount_minor
        - issued_at
        - occurred_at
        - description
        - billed_to
        - facts
        - verification
        - transaction_id
        - pdf_bytes
      properties:
        id:
          type: string
          description: "e.g. `rcp_...`."
        number:
          type: string
          description: "`PTD-RCT-<year>-<number>`, sequential within the year."
        kind:
          type: string
          enum:
            - payment
            - invoice_payment
            - credit_purchase
            - wallet_debit
            - refund
          description: "`payment` a card payment, `invoice_payment` an invoice paid by card or from credit, `credit_purchase` a top-up, `wallet_debit` credit taken for a new resource, `refund` money returned to your credit."
        issuer_name:
          type: string
          description: "The Pantech company that issued it: `Pantech Dynamics, Inc.` for USD payments, `Pantech Dynamics Ltd` for NGN payments."
        currency:
          type: string
          enum:
            - NGN
            - USD
        amount_minor:
          type: integer
          format: int64
        issued_at:
          type: [string, "null"]
          format: date-time
          description: When the receipt was issued.
        occurred_at:
          type: [string, "null"]
          format: date-time
          description: When the money moved.
        description:
          type: string
          description: "What it was for, e.g. `Account credit top-up`."
        billed_to:
          type: string
          description: Your organization, as printed on the receipt.
        facts:
          type: array
          description: "The details printed on the receipt, e.g. the payment method (`Visa •••• 4242`) and the date."
          items:
            type: object
            required:
              - label
              - value
            properties:
              label:
                type: string
              value:
                type: string
        verification:
          type: string
          description: "The code printed on the receipt, which Pantech uses to confirm a copy is genuine."
        transaction_id:
          type: string
          description: "The account transaction the receipt is for, e.g. `ltx_...`."
        pdf_bytes:
          type: integer
          description: The size of the PDF.
    ReceiptList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        next_cursor:
          type:
            - string
            - "null"
          description: "Pass as `cursor` for the next page; null on the last page."
    CreditPurchase:
      type: object
      description: One credit top-up.
      required:
        - id
        - status
        - amount_minor
        - currency
        - method
        - provider
        - checkout_url
        - checkout_expires_at
        - failure_code
        - settled_at
        - created_at
        - receipt
      properties:
        id:
          type: string
          description: "e.g. `cpr_...`."
        status:
          type: string
          enum:
            - pending
            - settled
            - failed
            - expired
            - refunded
            - charged_back
          description: "`pending` until paid; `settled` once the credit is in your balance."
        amount_minor:
          type: integer
          format: int64
          description: "The credit bought, in minor units of `currency`."
        currency:
          type: string
          enum:
            - NGN
            - USD
        method:
          type: string
          enum:
            - checkout
            - saved_card
            - bank_transfer
          description: "`checkout` for every purchase made through the API. Purchases made in the console may show another method."
        provider:
          type: string
          description: "An identifier for the payment processor that takes the payment. Treat it as an opaque label: values can be added."
        checkout_url:
          type: [string, "null"]
          format: uri
          description: "The provider's hosted payment page. Present only while the purchase is `pending` and can still be paid."
        checkout_expires_at:
          type: [string, "null"]
          format: date-time
          description: When the payment link stops working, if the provider sets a time.
        failure_code:
          type: [string, "null"]
          description: "Why the payment failed, when `status` is `failed`."
        settled_at:
          type: [string, "null"]
          format: date-time
          description: "When the credit was added; null until then."
        created_at:
          type: [string, "null"]
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        receipt:
          type:
            - object
            - "null"
          description: "The receipt, once the purchase has settled and the receipt is issued (usually within a minute); null until then. Fetch it with `GET /public/v1/billing/receipts/{receipt_id}`."
          required:
            - id
            - number
          properties:
            id:
              type: string
              description: "e.g. `rcp_...`."
            number:
              type: string
              description: "e.g. `PTD-RCT-2026-000123`."
    CreditOutlook:
      type: object
      description: "Credit against the estimated next invoice. Amounts are integers in minor units of `currency`."
      required:
        - currency
        - available_minor
        - pending_minor
        - prepaid_minor
        - estimated_next_invoice_minor
        - next_invoice_at
        - standing
        - has_payment_method
      properties:
        currency:
          type: string
          enum:
            - NGN
            - USD
        available_minor:
          type: integer
          format: int64
          description: Credit you can spend now.
        pending_minor:
          type: integer
          format: int64
          description: "Credit purchases that haven't settled yet. Not spendable until they do."
        prepaid_minor:
          type: integer
          format: int64
          description: "Initial payments for new instances that haven't been used yet. They count toward your next invoice before credit does."
        estimated_next_invoice_minor:
          type: integer
          format: int64
          description: An estimate of your next invoice, including VAT.
        next_invoice_at:
          type: string
          format: date-time
          description: When the current billing period closes and the invoice is issued.
        standing:
          type: string
          description: "`covered` when credit and prepaid instance payments cover the estimate, `low` when they don't, `empty` when no credit is left. Buy credit with `POST /public/v1/billing/credit/purchases`."
          enum:
            - covered
            - low
            - empty
        has_payment_method:
          type: boolean
          description: Whether a default payment method will be charged for anything credit doesn't cover.
    UsageSummary:
