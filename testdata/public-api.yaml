    SecurityGroup:
      type: object
      description: A reusable firewall for standard instances.
      required:
        - id
        - name
        - rules
        - desired_state
        - observed_state
      properties:
        id:
          type: string
          description: "e.g. `sg_...`."
        name:
          type: string
          description: "Its name, unique among your live security groups. The organization's default group is called `default`."
