# Pantech Dynamics public API: /public/v1. Additive changes only within v1.
openapi: "3.1.0"
info:
  title: Pantech Dynamics public API
  version: "1.0.0"
  description: |-
    The Pantech Dynamics public API lets your scripts, CI pipelines and tools manage everything you run on Pantech: instances, VPC networks, firewalls, public IPs, load balancers, volumes, snapshots, managed databases, managed Kubernetes clusters, SSH keys and webhooks.

    **Base URL:** `https://api.pantechdynamics.com/public/v1`

    **Authentication.** Every request needs an API key: `Authorization: Bearer PAN_…`. Create one in the console under Organization › API keys. A `read` key can call every GET; a `write` key can also create, change and delete. A key acts as the member who created it, with no more access than they have. `DELETE /me` revokes the key that sends it.

    **AI apps.** When a member connects an AI app (an AI assistant or coding tool) to Pantech, the app is given an API key of kind `ai_app`, shown under Organization › AI apps; `GET /me` reports `kind` and `client_name`. Its access is the level the member chose: `read` (Read only), `write` (Manage) or `write` plus `delete` (Manage and delete). An `ai_app` key with `write` but not `delete` can create and change resources but cannot make a destructive call — every DELETE except `DELETE /me`, rebuilding or restoring an instance, and lowering a snapshot schedule's `retention_count` (these operations are marked `x-destructive`); it gets `403 INSUFFICIENT_SCOPE` instead. A standard key's `write` covers destructive calls as it always has. Owners can turn AI app access off for the whole organization: every request made with an `ai_app` key, and every request sent by Pantech's MCP server (it sends the header `Pantech-Client: mcp/<version>`, whatever key it uses), then gets `403 AI_APPS_DISABLED` until it is turned back on. `DELETE /me` keeps working so an app can always be disconnected.

    **Asynchronous changes.** Writes return `202 Accepted` with an `operation_id`. Poll `GET /operations/{operation_id}` (or stream `/events`) until `status` is `succeeded` or `failed`. A new instance or database returns an order instead: follow `GET /instance-orders/{order_id}` or `GET /database-orders/{order_id}`.

    **Idempotency.** Every POST, PUT and DELETE needs an `Idempotency-Key` header. Retrying with the same key returns the original result instead of repeating the change. Some endpoints do not replay, and say so: `POST /ssh-keys`, `DELETE /ssh-keys/{ssh_key_id}`, `POST /instances/{instance_id}/console`, and the webhook test, delete, secret rotation and redelivery endpoints.

    **Errors.** Every error is `application/problem+json` with a stable `code`, a plain-language `detail` that says what went wrong and what to do, and a `request_id` to quote to support. Branch on `code`, never on `detail`. A `422 VALIDATION_FAILED` lists each invalid field in `errors` (`field`, `code`, `message`). Each endpoint below lists the codes it can return. Two more apply everywhere: `404 ROUTE_NOT_FOUND` (no endpoint matches the method and path) and `500 INTERNAL` (something failed on our side; retry with the same `Idempotency-Key`, and contact support with the `request_id` if it persists).

    **Failed operations.** An operation that fails has `status: failed` and a `failure` with a stable `code` and a readable `reason`, safe to show to your users. Common codes: `INSTANCE_BUSY` (the resource kept changing; retry when it has settled), `SECURITY_GROUP_ALLOWS_PRIVATE_NETWORK` (see *Add a private database network interface*), `DATABASE_STORAGE_RESIZE_FAILED` and `DATABASE_STORAGE_GROW_FAILED` (nothing changed and nothing extra is billed; retry later).

    **Pagination.** Lists return `{ "data": [...], "next_cursor": ... }`. Pass `next_cursor` as `cursor` until it is null.

    **Rate limits.** 300 requests/minute per key, plus shared verified-user and organization budgets (defaults: 1,200/minute per user and 6,000/minute per organization, including console traffic). Changing IPs or keys does not reset those budgets. Authenticated responses carry `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`; successful calls report the key budget. A quota `429` reports the denying budget and `RateLimit-Scope` (`api_key`, `user` or `organization`). Every `429` carries `Retry-After`. Separate edge/IP and failed-auth limits can refuse requests before these quotas.

    **Money.** Amounts are integers in minor units (`amount_minor`): kobo for NGN, cents for USD.
  contact:
    name: Pantech Dynamics support
    url: "https://pantechdynamics.com/contact"
servers:
  - url: "https://api.pantechdynamics.com"
    description: Production
security:
  - apiKey: []
tags:
  - name: Account
    description: The API key making the call.
  - name: Catalogue
    description: "What you can buy, and what it costs."
  - name: Instances
    description: "Virtual machines (VPS): create, power, change, delete."
  - name: Instance orders
    description: How a new instance is paid for and provisioned.
  - name: Networks
    description: "VPCs, subnets and their firewall rules."
  - name: Public IPs
    description: "Public addresses for VPC instances, and port forwarding."
  - name: Load balancers
    description: "Spread traffic on one public port across several instances in a private network."
  - name: Kubernetes
    description: "Managed Kubernetes clusters whose nodes are VMs in your account."
  - name: Security groups
    description: Reusable firewalls for standard instances.
  - name: Volumes
    description: Data disks.
  - name: Databases
    description: "Managed PostgreSQL, MySQL and MariaDB databases, reachable only from your own network."
  - name: Snapshots
    description: "Point-in-time copies of root disks and volumes, and automatic schedules."
  - name: SSH keys
    description: Keys installed on new instances.
  - name: Webhooks
    description: "Events sent to your own URL when something changes: resources finishing or failing a change, invoices, payments and credit."
  - name: Agent sessions
    description: "Work inside your own instances from your AI app: tool calls the instance carries out for the app. Every step is recorded, and commands wait for a person's approval. Only AI apps connected through Pantech's MCP server may call these endpoints for now; a standard API key gets 403 AGENT_SESSIONS_NOT_FOR_API_KEYS. A conversation with a coding agent on your model key, and your model keys, are in the console only (403 AGENT_CONVERSATION_IN_CONSOLE)."
  - name: Migrate
    description: "Move from another cloud: connect an AWS account without sharing keys, scan what runs there, and plan the move to Pantech with prices and a Terraform export. Copying servers arrives in a later release."
  - name: Operations
    description: Follow asynchronous changes.
  - name: Usage
    description: "What has been used, and what it cost."
  - name: Billing
    description: "Your credit, and whether it covers your next invoice."
paths:
  /public/v1/billing/credit:
    get:
      tags:
        - Billing
      summary: Get credit
      description: |-
        Your organization's credit, and how it compares with your next invoice.

        `estimated_next_invoice_minor` is usage so far this billing period plus the recent daily rate for the days left, plus 7.5% VAT on that (VAT applies only to the monthly invoice, never to credit purchases). It is an estimate: the invoice issued at `next_invoice_at` is the real figure. `standing` is `covered` when credit and prepaid instance payments cover the estimate, `low` when they don't, and `empty` when no credit is left. Anything credit doesn't cover is charged to your default payment method.

        Check this before creating resources from automation, or poll it to top up in time. Owners and admins are also emailed once when credit becomes `low` and once when it becomes `empty`. To add credit, see *Buy credit*.

        **Scope:** `read`.
      operationId: getCredit
      security:
        - apiKey: []
      x-scope: read
      x-order: 86
      responses:
        200:
          description: Credit.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditOutlook"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/billing/credit/purchases:
    post:
      tags:
        - Billing
      summary: Buy credit
      description: |-
        Creates a payment link to add credit to your organization. Send `checkout_url` to whoever pays: it opens the payment provider's own secure page, so no card details ever pass through your systems or ours. Organizations pay in NGN or USD. The currency follows your organization's country and can't be chosen.

        Nothing is charged until someone pays the link. The credit is added once the provider confirms the payment, usually within a minute: follow the purchase with `GET /public/v1/billing/credit/purchases/{purchase_id}` until `status` is `settled`, and the owners and admins get a receipt by email. A link that isn't paid expires at `checkout_expires_at`; create a new purchase after that.

        One purchase is between NGN 500 and NGN 500,000 (`50000` to `50000000` kobo), or between USD 5 and USD 2,000 (`500` to `200000` cents).

        Send an `Idempotency-Key`: a retry with the same key returns the same purchase and the same link. The member who created the key must be an owner or admin with a verified email.

        **Scope:** `write`.
      operationId: createCreditPurchase
      security:
        - apiKey: []
      x-scope: write
      x-order: 87
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCreditPurchaseRequest"
      responses:
        201:
          description: "The purchase, with its `checkout_url`."
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented for this endpoint.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          description: |-
            `INSUFFICIENT_SCOPE`: this API key has only the `read` scope. Use a key with `write` access.
            `FORBIDDEN`: only an owner or admin may buy credit. Use a key created by an owner or admin.
            `AI_APPS_DISABLED`: the organization has turned AI app access off, and this request was made with an AI app's key or sent by Pantech's MCP server. An owner can turn it on in the console under Organization › AI apps.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        409:
          description: |-
            `EMAIL_VERIFICATION_REQUIRED`: the member who created this key has not verified their email, where the receipt is sent. Verify it in the console, then retry.
            `CREDIT_PURCHASE_UNAVAILABLE`: credit can't be bought for this organization yet. Finish billing setup in the console, or contact support.
            `IDEMPOTENCY_CONFLICT`: this `Idempotency-Key` was already used for a different amount. Use a new key for a different purchase.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        413:
          description: |-
            `REQUEST_TOO_LARGE`: the body is larger than 64 KiB. Send a smaller request.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        422:
          description: |-
            `VALIDATION_FAILED`: a field is invalid. Each entry of `errors` names the `field` and its `code`:
            `amount_minor` `REQUIRED`: send a positive amount in minor units.
            `amount_minor` `AMOUNT_OUT_OF_RANGE`: the amount is outside the per-purchase limits above for your currency. Choose an amount within them.
            `UNKNOWN_FIELD`: the body has a field this endpoint does not take (named in `field`). Remove it or fix its spelling.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/billing/credit/purchases/{purchase_id}:
    get:
      tags:
        - Billing
      summary: Get a credit purchase
      description: |-
        One credit purchase: whether it has been paid. `checkout_url` is shown only while the purchase can still be paid. Poll this after *Buy credit* until `status` is `settled` (credit added), or `failed` or `expired` (nothing charged; create a new purchase).

        **Scope:** `read`.
      operationId: getCreditPurchase
      security:
        - apiKey: []
      x-scope: read
      x-order: 88
      parameters:
        - name: purchase_id
          in: path
          required: true
          description: "The purchase's id, e.g. `cpr_...`."
          schema:
            type: string
      responses:
        200:
          description: The purchase.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPurchase"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RESOURCE_NOT_FOUND`: no credit purchase with this id in your organization. Check the id (`cpr_…`).
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/billing/receipts:
    get:
      tags:
        - Billing
      summary: List receipts
      description: |-
        Every receipt issued to your organization, newest first. A receipt is issued, numbered `PTD-RCT-<year>-<number>`, whenever money moves: a card payment, a credit top-up, an invoice paid by card or from credit, a debit from your credit (for example a new instance's first charges), and a refund. A payment's receipt usually appears within a minute of it settling.

        **Scope:** `read`.
      operationId: listReceipts
      security:
        - apiKey: []
      x-scope: read
      x-order: 107
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        200:
          description: A page of receipts.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptList"
        400:
          description: |-
            `INVALID_CURSOR`: the cursor did not come from this list. Start again without one.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/billing/receipts/{receipt_id}:
    get:
      tags:
        - Billing
      summary: Get a receipt
      description: |-
        One receipt: what it was for, the amount, who issued it and the details printed on it. Download it as a PDF with `GET /public/v1/billing/receipts/{receipt_id}/pdf`.

        **Scope:** `read`.
      operationId: getReceipt
      security:
        - apiKey: []
      x-scope: read
      x-order: 108
      parameters:
        - name: receipt_id
          in: path
          required: true
          description: "The receipt's id, e.g. `rcp_...`."
          schema:
            type: string
      responses:
        200:
          description: The receipt.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Receipt"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RECEIPT_NOT_FOUND`: no receipt with this id in your organization. List your receipts to find it.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/billing/receipts/{receipt_id}/pdf:
    get:
      tags:
        - Billing
      summary: Download a receipt
      description: |-
        The receipt as a PDF, the same document that was emailed. The file name is the receipt number, e.g. `PTD-RCT-2026-000123.pdf`.

        **Scope:** `read`.
      operationId: getReceiptPdf
      security:
        - apiKey: []
      x-scope: read
      x-order: 109
      parameters:
        - name: receipt_id
          in: path
          required: true
          description: "The receipt's id, e.g. `rcp_...`."
          schema:
            type: string
      responses:
        200:
          description: The PDF.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            Content-Disposition:
              description: '`attachment; filename="PTD-RCT-2026-000123.pdf"`.'
              schema:
                type: string
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `RECEIPT_NOT_FOUND`: no receipt with this id in your organization. List your receipts to find it.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `BILLING_UNAVAILABLE`: billing is not answering right now. Wait a few seconds, then retry.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/database-engines:
    get:
      tags:
        - Databases
      summary: List database engines
      description: |-
        The engines and version lines you can create a managed database with: PostgreSQL, MySQL and MariaDB, long-term-support lines only. A version appears only while it is offered for new databases, and `zones` lists the zones it can be created in. An engine with no offered version has an empty `versions` list.

        Use `engine` and a `version` from here, and a zone from that version's `zones`, in *Create a database*.

        **Scope:** `read`.
      operationId: listDatabaseEngines
      security:
        - apiKey: []
      x-scope: read
      x-order: 89
      responses:
        200:
          description: The engines.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseEngineList"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          $ref: "#/components/responses/QuotaUnavailable"
  /public/v1/database-orders:
    get:
      tags:
        - Databases
      summary: List database orders
      description: |-
        Your database orders, newest first, one per *Create a database* call. An order shows whether the initial payment was taken and whether provisioning started. Never includes a password.

        **Scope:** `read`.
      operationId: listDatabaseOrders
      security:
        - apiKey: []
      x-scope: read
      x-order: 99
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        200:
          description: A page of orders.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseOrderList"
        400:
          description: |-
            `INVALID_PAGE`: `limit` is not a whole number from 1 to 100. Send a value in that range, or leave it out for 50.
            `INVALID_CURSOR`: `cursor` does not belong to this list with these filters. Start again without a cursor.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          $ref: "#/components/responses/QuotaUnavailable"
  /public/v1/database-orders/{order_id}:
    get:
      tags:
        - Databases
      summary: Get a database order
      description: |-
        Payment and provisioning progress for one new database. Poll it after *Create a database* until `status` is `provisioned` (then read the database at `GET /public/v1/databases/{database_id}`), or `payment_failed` or `failed` (final: any payment taken is returned to your credit, and `failure_code` says why). Once `operation_id` is set you can also follow that operation. Never includes a password.

        **Scope:** `read`.
      operationId: getDatabaseOrder
      security:
        - apiKey: []
      x-scope: read
      x-order: 100
      parameters:
        - name: order_id
          in: path
          required: true
          description: "The resource's id."
          schema:
            type: string
      responses:
        200:
          description: The order.
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseOrder"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
