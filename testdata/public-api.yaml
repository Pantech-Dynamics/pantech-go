    SecurityGroupRule:
      type: object
      required:
        - direction
        - protocol
        - cidr
      properties:
        direction:
          type: string
          description: "`ingress` (into the instance) or `egress` (out of it)."
          enum:
            - ingress
            - egress
        protocol:
          type: string
          description: "`tcp`, `udp`, `icmp` or `all`."
          enum:
            - tcp
            - udp
            - icmp
            - all
        port_range:
          type: string
          description: "For `tcp`/`udp`: one port (`22`) or an inclusive range (`8000-8100`). Empty or left out for `icmp` and `all`, meaning every port."
          examples: ["22"]
        cidr:
          type: string
          description: "One IPv4 CIDR: the source for `ingress`, the destination for `egress`, e.g. `203.0.113.4/32`. Avoid `0.0.0.0/0` on ingress where you can: it blocks private database network interfaces on instances using the group."
          examples: ["203.0.113.4/32"]
    Snapshot:
