        rules:
          type: array
          description: "Its rules. Inbound traffic no rule allows is dropped."
          items:
            $ref: "#/components/schemas/SecurityGroupRule"
        desired_state:
          type: string
          description: "What you asked for: `present`, or `deleted` once you deleted it."
          enum:
            - present
            - deleted
        observed_state:
          type: string
          description: "What the platform last observed: `pending` and `provisioning` while it is being created, `active` once ready, `deleting`/`deleted` on the way out, `failed` if it could not be made, `unknown` when it could not be checked."
          enum:
            - pending
            - provisioning
            - active
            - deleting
            - deleted
            - failed
            - unknown
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it last changed (RFC 3339, UTC)."
          readOnly: true
    SecurityGroupList:
      type: object
      required:
        - data
        - next_cursor
