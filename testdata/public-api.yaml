        api_allowed_cidrs:
          type: array
          items:
            type: string
          description: "IPv4 CIDRs allowed to connect to the cluster API."
    CreatePortForwardingRuleRequest:
      type: object
      required:
        - instance_id
        - protocol
        - public_port_start
      properties:
        instance_id:
          type: string
          description: "An instance in the public IP's VPC."
          examples: ["vm_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        protocol:
          type: string
          description: "`tcp` or `udp`."
          enum:
            - tcp
            - udp
        public_port_start:
          type: integer
          description: "First public port, 1 to 65535."
          examples: [443]
        public_port_end:
          type: integer
          description: "Last public port. Defaults to `public_port_start` (one port)."
          examples: [443]
        private_port_start:
          type: integer
          description: "First port on the instance. Defaults to `public_port_start`."
          examples: [8443]
        private_port_end:
          type: integer
          description: "Last port on the instance; the private range must be as wide as the public one. Defaults to match it."
          examples: [8443]
    CreatePublicIPRequest:
      type: object
      required:
        - network_id
      properties:
        network_id:
          type: string
          description: "The VPC network to allocate the address in. It must be active."
          examples: ["net_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        purpose:
          type: string
          default: static_nat
          description: "`static_nat` maps every port to one instance (`instance_id`). `port_forwarding` carries per-port rules instead, and `load_balancer` carries load balancers. Defaults to `static_nat`."
          enum:
            - static_nat
            - port_forwarding
            - load_balancer
        instance_id:
          type: string
          description: "For `static_nat` only: an instance in `network_id` without a public IP. Leave it out to reserve the address now and attach it later (`POST /public/v1/public-ips/{public_ip_id}/attach`). Leave out for `port_forwarding` and `load_balancer`."
          examples: ["vm_06gk3x9tq7m2v8r4y1c5d0zp8w"]
    CreateSSHKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "1 to 255 characters, unique among your SSH keys."
          minLength: 1
          maxLength: 255
          examples: ["deploy"]
        public_key:
          type: string
          description: "One OpenSSH public key line, e.g. `ssh-ed25519 AAAA… deploy@ci`. Leave out to have a key pair generated; its private key is then returned once."
          examples: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExample deploy@ci"]
    CreateSecurityGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "1 to 255 characters, unique among your live security groups."
          minLength: 1
          maxLength: 255
          examples: ["web"]
        rules:
          type: array
          description: "The group's rules; at least one. Inbound traffic no rule allows is dropped."
          items:
            $ref: "#/components/schemas/SecurityGroupRule"
    ResizeDatabaseStorageRequest:
      type: object
      required:
        - storage_gb
      properties:
        storage_gb:
          type: integer
          minimum: 1
          description: "The new data disk size in GB: larger than the current `data_volume_size_gb`, at most the zone's `max_gb` (2000 today) and a multiple of its `step_gb` (10 today); see `storage` in `GET /public/v1/database-engines`. It only grows."
          examples: [100]
    CreateSnapshotRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "1 to 255 characters, unique among this resource's snapshots, e.g. `pre-upgrade`."
          minLength: 1
          maxLength: 255
          examples: ["pre-upgrade"]
    CreateSubnetRequest:
      type: object
      required:
        - name
        - cidr
      properties:
        name:
          type: string
          description: "1 to 255 characters."
          minLength: 1
          maxLength: 255
          examples: ["app"]
        cidr:
          type: string
          description: "An IPv4 range inside the VPC's CIDR that does not overlap its other subnets, e.g. `10.0.1.0/24`."
          examples: ["10.0.1.0/24"]
    CreateVolumeRequest:
      type: object
      required:
        - name
        - disk_offering_slug
      properties:
        name:
          type: string
          description: "1 to 255 characters."
          minLength: 1
          maxLength: 255
          examples: ["data"]
        disk_offering_slug:
          type: string
          description: "The volume type, from `GET /public/v1/disk-offerings`."
          examples: ["medium-20gb"]
        size_gb:
          type: integer
          description: "Size in GB. Required for an offering with `custom_size: true`; ignored otherwise."
          examples: [100]
        region:
          type: string
          description: "A region from `GET /public/v1/regions`. Defaults to the platform's region."
          examples: ["af-abj"]
        instance_id:
          type: string
          description: "Attach the new volume at once to this running instance in the same zone."
          examples: ["vm_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        mount_point:
          type: string
          description: "With `instance_id`: an absolute path to mount the volume at, e.g. `/data`."
          examples: ["/data"]
        encrypted:
          type: boolean
          description: |-
            Optional. `true` asks for an **encrypted data volume**. It is a request, not encryption yet: the volume reports `encryption.status` `requested` until its disk has been formatted with a key from Pantech, and `encrypted` only once the platform has confirmed that. The format happens inside the instance, by the Pantech volume agent (`pantech-vkey`): attach the volume to an instance that runs the agent and it formats the new, empty disk for you as soon as it appears, so you only create a filesystem on `/dev/mapper/pvk-...` and mount it. Creating or attaching alone encrypts nothing, an instance without the agent cannot encrypt it, and a disk that already holds data is never formatted. Its key is released only to the instance of your organization the volume is attached to, so the volume can be used with any instance that runs the agent, an encrypted VM or a plain one. Refused with `ENCRYPTION_NOT_SUPPORTED` when encrypted volumes are not enabled for your organization, and `ENCRYPTED_VOLUMES_UNAVAILABLE` while the service is off. `false` or omitted creates a plain volume, as before.
          examples: [true]
    ChangeDatabasePasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
          description: "The new admin password: 16 to 128 printable ASCII characters, with no spaces, single quotes (`'`), double quotes (`\"`) or backslashes (`\\`). Write-only: never stored in plain text, never returned, never logged."
          pattern: "^[!#-&(-\\[\\]-~]{16,128}$"
          examples: ["c0rrect-H0rse-battery-St4ple"]
    CreateDatabaseRequest:
      type: object
      required:
        - name
        - engine
        - version
        - plan_slug
        - zone_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: "1 to 255 characters, unique among your databases."
          examples: ["orders-db"]
        engine:
          type: string
          description: "`postgresql`, `mysql` or `mariadb`; see `GET /public/v1/database-engines`."
          enum:
            - postgresql
            - mysql
            - mariadb
        version:
          type: string
          description: "A version line offered for `engine` in `zone_id`, from `GET /public/v1/database-engines`, e.g. `18` for PostgreSQL or `8.4` for MySQL."
          examples: ["18"]
        plan_slug:
          type: string
          description: "The size, from `GET /public/v1/plans`: its vCPU and memory, and its `disk_gb` as the smallest data disk."
          examples: ["starter"]
        zone_id:
          type: string
          description: "Where to create it: a zone from the version's `zones`, e.g. `af-abj-1` (standard) or `af-abj-2` (VPC)."
          examples: ["af-abj-2"]
        subnet_id:
          type: string
          description: "Required in a VPC zone (`af-abj-2`): one of your subnets there, which the database joins. Leave out in a standard zone."
          examples: ["snet_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        access_rules:
          type: array
          maxItems: 50
          description: "The initial allow-list: IPv4 CIDRs with a prefix of `/8` or longer, never `0.0.0.0/0`, at most 50, no range twice. Leave out for the zone's default (the subnet's VPC CIDR in a VPC zone, nobody in a standard zone); send `[]` for nobody."
          examples: [["10.0.1.0/24", "10.250.3.17/32"]]
          items:
            type: string
        admin_username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-z][a-z0-9_]{2,31}$"
          description: "The admin login's name: 3 to 32 characters, lowercase letters, digits and underscores, starting with a letter. Reserved, and refused with `INVALID_DATABASE_ADMIN_USERNAME`: `root`, `postgres`, `public`, `none`, `all`, `user`, `sys`, `system`, `replication`, `current_user`, `current_role`, `session_user`, and any name starting with `pg_`, `mysql`, `mariadb` or `pantech`. Not secret. Defaults to `dbadmin`."
          default: "dbadmin"
          examples: ["app_admin"]
        password:
          type: string
          minLength: 16
          maxLength: 128
          writeOnly: true
          description: "Optional admin password: 16 to 128 printable ASCII characters, with no spaces, single quotes (`'`), double quotes (`\"`) or backslashes (`\\`). Write-only: never stored in plain text, never returned, never logged. Leave it out to have a 32-character password generated and returned once in the response."
          pattern: "^[!#-&(-\\[\\]-~]{16,128}$"
          examples: ["c0rrect-H0rse-battery-St4ple"]
        storage_gb:
          type: integer
          minimum: 1
          description: "Data disk size in GB. Leave out for the plan's `disk_gb`. Otherwise at least the plan's `disk_gb` (or the zone's `min_gb` when larger), at most the zone's `max_gb` (2000 today), and above that base a multiple of the zone's `step_gb` (10 today); the base itself is always allowed. Read the zone's limits and price from `storage` in `GET /public/v1/database-engines` rather than hard-coding them. The upfront payment and the hourly storage price use this size. It can be grown later, never shrunk."
          examples: [100]
    Database:
      type: object
      required:
        - id
        - name
        - engine
        - version
        - port
        - plan_id
        - data_volume_size_gb
        - pending_data_volume_size_gb
        - zone_id
        - subnet_id
        - hostname
        - private_ip
        - desired_state
        - observed_state
        - generation
        - observed_generation
        - access_rules
        - failure_code
        - created_at
        - updated_at
        - admin_username
        - security_group_ids
        - effective_access_rules
        - ignored_security_group_rules
      properties:
        admin_username:
          type: string
          description: "The admin login to connect as: the one chosen at create, or `dbadmin`. `pantech_admin` for a database created before the login could be chosen."
          examples: ["dbadmin"]
        security_group_ids:
          type: array
          description: "Your security groups attached to the database, in the order attached (at most 5). `[]` when none."
          items:
            type: string
        effective_access_rules:
          type: array
          description: "The allow-list as the database applies it: its own `access_rules` plus the ranges its security groups add, each range once under its first source. In effect once `observed_generation` equals `generation`."
          items:
            $ref: "#/components/schemas/DatabaseEffectiveAccessRule"
        ignored_security_group_rules:
          type: array
          description: "Rules of the attached security groups that add nothing to the database, and why. `[]` when none."
          items:
            $ref: "#/components/schemas/DatabaseIgnoredSecurityGroupRule"
        id:
          type: string
          description: "The database's id, `db_` followed by 26 characters."
          readOnly: true
          examples: ["db_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        name:
          type: string
          description: "Its name, unique among your databases."
          examples: ["orders-db"]
        engine:
          type: string
          description: "`postgresql`, `mysql` or `mariadb`."
          enum:
            - postgresql
            - mysql
            - mariadb
        version:
          type: string
          description: "The engine's version line, e.g. `18` or `8.4`. Minor updates within the line are applied by the platform."
          examples: ["18"]
        port:
          type: integer
          description: "The TCP port to connect to: 5432 for PostgreSQL, 3306 for MySQL and MariaDB."
          examples: [5432]
        plan_id:
          type: string
          description: "The plan setting its vCPU and memory."
          examples: ["plan_06gk3x9tq7m2v8r4y1c5d0zp8w"]
        data_volume_size_gb:
          type: integer
          description: "The data disk's size in GB, as in place and billed."
          examples: [80]
        pending_data_volume_size_gb:
          type:
            - integer
            - "null"
          description: "The size a storage resize in flight is growing the data disk to; null when none."
        zone_id:
          type: string
          description: "The zone it runs in, e.g. `af-abj-2`."
          examples: ["af-abj-2"]
        subnet_id:
          type:
            - string
            - "null"
          description: "Its VPC subnet in a VPC zone; null in a standard zone."
        hostname:
          type:
            - string
            - "null"
          description: "The name to connect to, e.g. `db-7k2q9x4m1a.af-abj-2.db.pantechdynamics.com`. It resolves to `private_ip` and works only from where that address is reachable. Null until assigned."
          examples: ["db-7k2q9x4m1a.af-abj-2.db.pantechdynamics.com"]
        private_ip:
          type:
            - string
            - "null"
          description: "The database's private address, never public. Null until assigned."
          examples: ["10.0.1.12"]
        desired_state:
          type: string
          description: "What you asked for: `running`, `stopped` or `deleted`."
          enum:
            - running
            - stopped
            - deleted
        observed_state:
          type: string
          description: "What the platform last observed. A change is complete when it matches `desired_state`; `failed` means the last change could not be made (see the failure fields), and `unknown` means the platform could not check."
          enum:
            - pending
            - provisioning
            - running
            - stopping
            - stopped
            - deleting
            - deleted
            - failed
            - unknown
        generation:
          type: integer
          description: "Increases by one with every change you request."
          readOnly: true
        observed_generation:
          type: integer
          description: "The `generation` last applied: equal to `generation` once the last change (access rules, security groups, password) is in effect."
          readOnly: true
        access_rules:
          type: array
          description: "The database's own allow-list, as set at create or with *Replace access rules*."
          items:
            $ref: "#/components/schemas/DatabaseAccessRule"
        failure_code:
          type:
            - string
            - "null"
          description: "A stable code for why the last change failed; null when nothing failed. The failed operation's `failure.reason` explains it."
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it last changed (RFC 3339, UTC)."
          readOnly: true
    DatabaseAccessRule:
      type: object
      required:
        - cidr
        - protocol
        - port
      properties:
        cidr:
          type: string
          description: "An allowed IPv4 range, in canonical form."
          examples: ["10.0.1.0/24"]
        protocol:
          type: string
          description: "Always `tcp`."
          enum:
            - tcp
        port:
          type: integer
          description: "The engine's port: 5432 or 3306."
          examples: [5432]
    DatabaseEffectiveAccessRule:
      type: object
      required:
        - cidr
        - protocol
        - port
        - source
      properties:
        cidr:
          type: string
          description: "An allowed IPv4 range, in canonical form."
          examples: ["10.0.1.0/24"]
        protocol:
          type: string
          description: "Always `tcp`."
          enum:
            - tcp
        port:
          type: integer
          description: "The engine's port: 5432 or 3306."
          examples: [5432]
        source:
          type: string
          description: "Where the range comes from: `access_rule`, or `security_group:` followed by the group's id (e.g. `security_group:sg_…`)."
          examples: ["access_rule"]
    DatabaseIgnoredSecurityGroupRule:
      type: object
      required:
        - security_group_id
        - direction
        - protocol
        - port_range
        - cidr
        - reason
      properties:
        security_group_id:
          type: string
          description: "The attached group the rule belongs to."
        direction:
          type: string
          description: "The rule's direction."
          enum:
            - ingress
            - egress
        protocol:
          type: string
          description: "The rule's protocol."
          enum:
            - tcp
            - udp
            - icmp
            - all
        port_range:
          type:
            - string
            - "null"
          description: "`80`, `3000-4000`, or null for all ports."
        cidr:
          type: string
          description: "The rule's CIDR."
          examples: ["0.0.0.0/0"]
        reason:
          type: string
          description: "Why it adds nothing: `egress_rule`, `protocol_not_tcp` (udp or icmp), `port_not_covered` (its ports exclude the engine's), `cidr_too_wide` (wider than /8, including `0.0.0.0/0`) or `cidr_not_ipv4`."
          enum:
            - egress_rule
            - protocol_not_tcp
            - port_not_covered
            - cidr_too_wide
            - cidr_not_ipv4
    SetDatabaseSecurityGroupsRequest:
      type: object
      required:
        - security_group_ids
      properties:
        security_group_ids:
          type: array
          maxItems: 5
          description: "The complete set to attach: at most 5 distinct ids of your own security groups in the database's zone, e.g. `sg_…`. `[]` detaches every group."
          uniqueItems: true
          examples: [["sg_06gk3x9tq7m2v8r4y1c5d0zp8w"]]
          items:
            type: string
    DatabaseAccessRuleRequest:
      type: object
      required:
        - cidr
      properties:
        cidr:
          type: string
          description: "One IPv4 CIDR to allow, with a prefix of `/8` to `/32`; never `0.0.0.0/0`. Host bits are masked (`10.0.1.7/24` is stored as `10.0.1.0/24`). Use `/32` for one address, such as an instance's `private_network_ip`."
          examples: ["10.250.3.17/32"]
    DatabaseEngine:
      type: object
      required:
        - engine
        - display_name
        - port
        - versions
        - storage
      properties:
        engine:
          type: string
          description: "The value `engine` takes in *Create a database*: `postgresql`, `mysql` or `mariadb`."
          examples: ["postgresql"]
        display_name:
          type: string
          description: "The engine's name for display."
          examples: ["PostgreSQL"]
        port:
          type: integer
          description: "The port its databases listen on: 5432 or 3306."
          examples: [5432]
        versions:
          type: array
          description: "Version lines offered for new databases, long-term-support lines only. Empty when none is offered right now."
          items:
            type: object
            required:
              - version
              - eol_date
              - zones
            properties:
              version:
                type: string
              eol_date:
                type:
                  - string
                  - "null"
                format: date
              zones:
                type: array
                items:
                  type: string
        storage:
          type: array
          description: "The data disk sizes a new database of this engine may have, per zone: use them for `storage_gb` in *Create a database* and *Grow a database's storage*. One entry per zone where a version of this engine can be created and database storage is available. Read the allowed sizes from here rather than hard-coding them."
          items:
            type: object
            required:
              - zone_id
              - min_gb
              - min_is_plan_disk
              - max_gb
              - step_gb
              - price_per_gb_month_minor
              - currency
            properties:
              zone_id:
                type: string
                description: "The zone, e.g. `af-abj-2`."
                examples: ["af-abj-2"]
              min_gb:
                type: integer
                description: "The zone's minimum data disk in GB. 0 means the plan's `disk_gb` is the minimum; otherwise the minimum is the larger of the plan's `disk_gb` and this value."
                minimum: 0
                examples: [0]
              min_is_plan_disk:
                type: boolean
                description: "True when `min_gb` is 0, so the chosen plan's `disk_gb` is the minimum."
              max_gb:
                type: integer
                description: "The largest data disk in GB."
                examples: [2000]
              step_gb:
                type: integer
                description: "Above the base size (the minimum), `storage_gb` must be a multiple of this."
                examples: [10]
              price_per_gb_month_minor:
                type:
                  - integer
                  - "null"
                format: int64
                description: "Price of one GB of data disk for a 730-hour month, in minor units of `currency`; null when it could not be priced."
              currency:
                type:
                  - string
                  - "null"
                description: "`NGN` or `USD`; null when not priced."
    DatabaseEngineList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseEngine"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    DatabaseList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Database"
        next_cursor:
          type:
            - string
            - "null"
          description: "Pass as `cursor` for the next page; null on the last page."
    DatabaseOrder:
      type: object
      description: "How a new database is paid for and provisioned. Never includes a password. The console API returns the same order, naming the id `order_id`."
      required:
        - id
        - order_id
        - attempt_id
        - database_id
        - status
        - operation_id
        - failure_code
        - amount_minor
        - currency
        - created_at
        - updated_at
        - admin_username
      properties:
        admin_username:
          type: string
          description: "The admin login the database is created with."
        id:
          type: string
          description: "The order's id, `ord_…`."
          readOnly: true
        order_id:
          type: string
          description: "The same value as `id`."
        attempt_id:
          type:
            - string
            - "null"
          description: "The card payment attempt; null when the order was paid from credit or not charged yet."
        database_id:
          type: string
          description: "The id the database has, or will have once provisioned."
        status:
          type: string
          description: "`awaiting_payment`, then `paid`, `provisioning` and `provisioned` (final: the database exists). `payment_failed` (no payment could be taken; nothing charged, or it was returned) and `failed` (provisioning could not start; any payment taken is returned to your credit) are final too."
          enum:
            - awaiting_payment
            - paid
            - provisioning
            - provisioned
            - payment_failed
            - failed
        operation_id:
          type:
            - string
            - "null"
          description: "The database's create operation, set once provisioning starts; null before."
        failure_code:
          type:
            - string
            - "null"
          description: "Why the order failed, when it did: e.g. `insufficient_credit`, `card_declined`, `payment_expired` (not paid within an hour), `database_name_taken`, `provisioning_failed`. Null otherwise. `organization_deleted`: the order was cancelled because its organization was deleted; any payment taken is returned to credit."
        amount_minor:
          type: integer
          format: int64
          description: "The initial payment in minor units of `currency` (kobo or cents)."
        currency:
          type: string
          description: "`NGN` or `USD`: your organization's billing currency."
          enum:
            - NGN
            - USD
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it last changed (RFC 3339, UTC)."
          readOnly: true
    DatabaseOrderList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DatabaseOrder"
        next_cursor:
          type:
            - string
            - "null"
          description: "Pass as `cursor` for the next page; null on the last page."
    DatabaseOrderAccepted:
      type: object
      description: "Returned with `202 Accepted` by `POST /public/v1/databases`, with `Cache-Control: no-store`: the order that pays for and then provisions the database."
      required:
        - order_id
        - database_id
        - resource_id
        - status
        - operation_id
        - failure_code
        - amount_minor
        - currency
        - password_returned
        - password
        - admin_username
      properties:
        admin_username:
          type: string
          description: "The admin login the database is created with: the one you sent, or `dbadmin`."
        order_id:
          type: string
          description: "Follow it at `GET /public/v1/database-orders/{order_id}` (also the `Location` header)."
        database_id:
          type: string
          description: The id the database will have.
        resource_id:
          type: string
          description: Same as `database_id`.
        status:
          type: string
          description: "The order's status now, usually `awaiting_payment`. See `DatabaseOrder.status`."
          enum:
            - awaiting_payment
            - paid
            - provisioning
            - provisioned
            - payment_failed
            - failed
        operation_id:
          type:
            - string
            - "null"
          description: Set once provisioning starts.
        failure_code:
          type:
            - string
            - "null"
          description: "Null for a new order; on a retry, the order's `failure_code` if it has failed since."
        amount_minor:
          type: integer
          description: "The initial payment, in minor units (kobo or cents): the price of an instance of the same plan with no public address."
          format: int64
        currency:
          type: string
          description: "`NGN` or `USD`: your organization's billing currency."
          enum:
            - NGN
            - USD
        password_returned:
          type: boolean
          description: "True only when the password was generated for you and this request created the order. Otherwise `password` is null: you chose the password, or this is a retry."
        password:
          type:
            - string
            - "null"
          description: "The generated admin password (32 letters and digits), in this response only. Store it securely now: it is never readable again. Null when you chose the password or on a retry."
          examples: ["q8Vn3TzK1mXw7RbLc4Hs9JdP2fYa6GeU"]
    DatabasePasswordAccepted:
      type: object
      description: "Returned with `202 Accepted` by `reset-password`, with `Cache-Control: no-store`."
      required:
        - operation_id
        - resource_id
        - status
        - password_returned
        - password
      properties:
        operation_id:
          type: string
          description: "The operation carrying out the change. Poll `GET /public/v1/operations/{operation_id}` (also the `Location` header) until `status` is `succeeded` or `failed`."
        resource_id:
          type: string
          description: The database.
        status:
          type: string
          description: "The operation's status when the request was accepted, usually `submitting`."
        password_returned:
          type: boolean
          description: "False on a retry with the same Idempotency-Key; `password` is then null."
        password:
          type:
            - string
            - "null"
          description: "The generated admin password (32 letters and digits), in this response only. Store it securely now: it is never stored and cannot be read again. Null on a retry."
          examples: ["q8Vn3TzK1mXw7RbLc4Hs9JdP2fYa6GeU"]
    DiskOffering:
      type: object
      required:
        - slug
        - name
        - custom_size
        - currency
        - hourly_price_minor
      properties:
        slug:
          type: string
          description: "Use this in `disk_offering_slug`."
        name:
          type: string
          description: "Its name for display."
        size_gb:
          type:
            - integer
            - "null"
          description: "Fixed size; null for a custom-size offering."
        custom_size:
          type: boolean
          description: "When true, send `size_gb` on create; the price is then per GB."
        storage_type:
          type:
            - string
            - "null"
          description: "The storage class, e.g. `shared` or `local`; null when not stated."
        currency:
          type: string
          description: "`NGN` or `USD`: your organization's currency."
        hourly_price_minor:
          type: integer
          format: int64
          description: "Price per hour in minor units of `currency`: for the whole volume, or per GB for a custom-size offering."
    DiskOfferingList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
