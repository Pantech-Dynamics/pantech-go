        - disk_offering_slug
        - desired_state
        - observed_state
      properties:
        id:
          type: string
          description: "e.g. `vol_...`."
        name:
          type: string
          description: "Its name."
          examples: ["data"]
        size_gb:
          type: integer
          description: "Its size in GB."
          examples: [100]
        disk_offering_slug:
          type: string
          description: "See `GET /public/v1/disk-offerings`."
        storage_type:
          type:
            - string
            - "null"
          description: "The storage class, e.g. `shared`; null when not stated."
        region:
          type:
            - string
            - "null"
        zone:
          type:
            - string
            - "null"
        attached_instance_id:
          type:
            - string
            - "null"
          description: "The instance it is attached to; null when detached."
        attached_instance_name:
          type:
            - string
            - "null"
          description: "That instance's name; null when detached."
        desired_instance_id:
          type:
            - string
            - "null"
          description: Where an attach in progress is moving it.
        mount_point:
          type:
            - string
            - "null"
          description: "Where it is mounted, when mounted at create; null otherwise."
        source_snapshot_id:
          type:
            - string
            - "null"
          description: Set when restored from a snapshot.
        monthly_cost:
          type:
            - object
            - "null"
          description: "What it costs per month at its size; null when it cannot be priced."
          required:
            - currency
            - amount_minor
          properties:
            currency:
              type: string
            amount_minor:
              type: integer
              format: int64
        desired_state:
          type: string
          description: "What you asked for: `present`, or `deleted` once you deleted it."
          enum:
            - present
            - deleted
        observed_state:
          type: string
          description: "What the platform last observed: `pending` and `provisioning` while it is being created, `active` once ready, `deleting`/`deleted` on the way out, `failed` if it could not be made, `unknown` when it could not be checked."
          enum:
            - pending
            - provisioning
            - active
            - deleting
            - deleted
            - failed
            - unknown
        encryption:
          type: object
          description: "What the platform can truthfully say about this volume's encryption. `status` is `none` for a plain volume, `requested` when you asked for encryption at creation and the disk has not been formatted yet, and `encrypted` once the platform has confirmed the disk was formatted with a key from the volume key service. `encrypted` is set only by the platform, never from a claim."
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - none
                - requested
                - encrypted
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it last changed (RFC 3339, UTC)."
          readOnly: true
    VolumeList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Volume"
        next_cursor:
          type:
            - string
            - "null"
          description: "Pass as `cursor` for the next page; null on the last page."
    Webhook:
      type: object
      description: "A URL Pantech sends your organization's events to."
      required:
        - id
        - url
        - description
        - events
        - enabled
        - disabled_reason
        - failing_since
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: "e.g. `whk_...`."
        url:
          type: string
          description: "Where events are sent: an `https` URL on the public internet."
          examples: ["https://example.com/hooks/pantech"]
        description:
          type: string
          description: "Your note about it; may be empty."
        events:
          type: array
          description: "What it subscribes to: event types, `<resource>.*`, or `*`."
          items:
            type: string
          examples: [["instance.*", "invoice.paid"]]
        enabled:
          type: boolean
          description: "Whether events are sent to it."
        disabled_reason:
          type:
            - string
            - "null"
          description: "Why it is disabled: `disabled_by_user`, or `failing` after three days of failed deliveries. Null while enabled."
          enum:
            - disabled_by_user
            - failing
            - null
        failing_since:
          type:
            - string
            - "null"
          format: date-time
          description: "When its deliveries started failing with no success since (RFC 3339, UTC); null while they succeed."
        created_at:
          type: string
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
        updated_at:
          type: string
          format: date-time
          description: "When it last changed (RFC 3339, UTC)."
    WebhookWithSecret:
      allOf:
