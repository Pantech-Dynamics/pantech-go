            - provisioning
            - active
            - deleting
            - deleted
            - failed
            - unknown
        completed_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When the snapshot finished; null until then."
        created_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was created (RFC 3339, UTC)."
          readOnly: true
        updated_at:
