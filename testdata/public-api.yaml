          description: "The database's id, e.g. `db_...`."
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSnapshotRequest"
            examples:
              named:
                summary: "Name the snapshot"
                value: {"name": "pre-upgrade"}
      responses:
        202:
          description: "Accepted. Follow `operation_id` until it finishes."
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
              examples:
                accepted:
                  summary: "Accepted; the new snapshot's id is resource_id"
                  value: {"operation_id": "op_06gk3x9tq7m2v8r4y1c5d0zp8w", "resource_id": "snap_06gk3x9tq7m2v8r4y1c5d0zp8w", "status": "submitting"}
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented for this endpoint.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          description: |-
            `DATABASE_NOT_FOUND`: no database with this id in your organization. Check the id: a database of another organization is reported the same way.
            `RESOURCE_NOT_FOUND`: the id is not a database id (`db_…`). Check the path.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        409:
          description: |-
            `ACCOUNT_SUSPENDED`: an invoice is overdue, or the organization was suspended for non-payment. Pay the outstanding invoice in the console, then retry.
            `DATABASE_SNAPSHOT_NOT_READY`: the database is not running or stopped (it is starting, stopping, being created or deleted). Wait until it is running or stopped, then retry.
            `DATABASE_SNAPSHOT_NAME_TAKEN`: this database already has a snapshot with that name. Choose a different name.
            `CONCURRENT_UPDATE`: the resource changed while this request was being processed. Retry the request; if it repeats, read the resource first.
          content:
            "application/problem+json":
