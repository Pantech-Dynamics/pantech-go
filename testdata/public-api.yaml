          type:
            - string
            - "null"
          description: "The source volume's name; null when it is gone or not a volume snapshot."
        database_id:
          type:
            - string
            - "null"
          description: "Set for a snapshot of a managed database's data disk. Exactly one of `instance_id`, `volume_id` and `database_id` is set."
        region:
          type:
            - string
            - "null"
          description: "The source's region, e.g. `af-abj`."
        trigger:
          type: string
