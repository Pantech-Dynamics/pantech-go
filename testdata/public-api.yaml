  /public/v1/kubernetes-clusters/{cluster_id}/expose-service:
    post:
      tags:
        - Kubernetes
      summary: Expose a Kubernetes service
      description: |-
        Routes `public_port` on the cluster's public address to a Service. The Service's port becomes a NodePort (`node_port`, or the one it has, or one the cluster picks), the Service records the public port in its `pantechdynamics.com/public-port` annotation, and routing is synced. The cluster is the record of what is exposed: removing the annotation with kubectl and syncing routing takes the route away. Your subnet's firewall rules must allow the public port.

        Public routing needs a cluster in a VPC subnet: it uses the VPC's public address. Port 22 and the cluster's API port are reserved.

        Errors: `404 KUBERNETES_CLUSTER_NOT_FOUND`; `404 KUBERNETES_SERVICE_NOT_FOUND` (apply the Service first); `409 PORT_IN_USE` (another service, cluster or resource uses that public port; choose another); `409 KUBERNETES_ROUTING_UNAVAILABLE` (a cluster with no VPC address); `409 KUBERNETES_CLUSTER_NOT_RUNNING`; `422 VALIDATION_FAILED` (`service_name`, `public_port` or `node_port`; or `INVALID_KUBERNETES_MANIFEST` when the cluster refused the change); `503 KUBERNETES_API_UNREACHABLE` (retry).
      operationId: exposeKubernetesService
      security:
        - apiKey: []
      x-scope: write
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_name, public_port]
              properties:
                service_name: {type: string}
                namespace: {type: string, description: "Default `default`."}
                public_port: {type: integer, minimum: 1, maximum: 65535}
                node_port: {type: integer, minimum: 30000, maximum: 32767, description: "Leave out to keep the Service's own NodePort, or let the cluster choose one."}
                protocol: {type: string, enum: [TCP, UDP], default: "TCP"}
      responses:
        "200":
          description: The service is routed.
          content:
            application/json:
              schema:
                type: object
                required: [success, cluster_id, service_name, namespace, public_ip, public_port, node_port, protocol, external_url, status]
                properties:
                  success: {type: boolean}
                  cluster_id: {type: string}
                  service_name: {type: string}
                  namespace: {type: string}
                  public_ip: {type: string}
                  public_port: {type: integer}
                  node_port: {type: integer}
                  protocol: {type: string}
                  external_url: {type: string, examples: ["http://203.0.113.10:8088"]}
                  status: {type: string, enum: [active]}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`KUBERNETES_CLUSTER_NOT_FOUND` or `KUBERNETES_SERVICE_NOT_FOUND`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`PORT_IN_USE`, `KUBERNETES_ROUTING_UNAVAILABLE` or `KUBERNETES_CLUSTER_NOT_RUNNING`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "`KUBERNETES_API_UNREACHABLE`: retry."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
  /public/v1/kubernetes-clusters/{cluster_id}/sync-routing:
    post:
      tags:
        - Kubernetes
      summary: Sync a cluster's public routing
      description: |-
        Reconciles the port forwards on the cluster's public address with what the cluster exposes now: its API server (unless its endpoint is private), on the cluster's own API port, and every Service carrying the `pantechdynamics.com/public-port` annotation. Routes to services no longer exposed are removed. Only the cluster's own routes are ever changed: other clusters and your own port forwards on the same address are left alone.

        Every cluster on a shared address gets its own API port: the first 6443, the next 6444, and so on. A new cluster's API port is routed automatically once it is running; call this after exposing or unexposing services with kubectl. If the API server does not answer, only its own route is ensured and no service route is removed.

        Errors: `404 KUBERNETES_CLUSTER_NOT_FOUND`; `409 PORT_IN_USE`; `409 KUBERNETES_ROUTING_UNAVAILABLE` (a cluster with no VPC address); `409 KUBERNETES_CLUSTER_NOT_RUNNING`.
      operationId: syncKubernetesRouting
      security:
        - apiKey: []
      x-scope: write
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The routes now in place.
          content:
            application/json:
              schema:
                type: object
                required: [success, cluster_id, public_ip, api_port, synced_ports, message]
                properties:
                  success: {type: boolean}
                  cluster_id: {type: string}
                  public_ip: {type: string}
                  api_port: {type: ["integer", "null"], description: "Null for a private endpoint."}
                  synced_ports:
                    type: array
                    items:
                      type: object
                      required: [purpose, public_port, private_port, protocol, target, status]
                      properties:
                        purpose: {type: string, enum: [kubernetes-api, service]}
                        public_port: {type: integer}
                        private_port: {type: integer}
                        protocol: {type: string}
                        target: {type: string, description: "`control node`, or the service as namespace/name."}
                        status: {type: string, enum: [active]}
                  message: {type: string}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`KUBERNETES_CLUSTER_NOT_FOUND`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`PORT_IN_USE`, `KUBERNETES_ROUTING_UNAVAILABLE` or `KUBERNETES_CLUSTER_NOT_RUNNING`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
