            properties:
              name:
                type: string
              email:
                type:
                  - string
                  - "null"
              is_admin:
                type: boolean
              created_at:
                type:
                  - string
                  - "null"
                format: date-time
        ssh_keys:
          type: array
          items:
            type: object
            required:
              - name
              - region
              - fingerprint
              - public_key
            properties:
              name:
                type: string
              region:
                type: string
              fingerprint:
                type:
                  - string
                  - "null"
              public_key:
                type:
                  - string
                  - "null"
    MigrationFlag:
      type: object
      required:
        - code
        - message
        - blocking
      properties:
        code:
          type: string
        message:
          type: string
        blocking:
          type: boolean
          description: A blocking flag makes the item unsupported.
    MigrationRule:
      type: object
      required:
        - direction
        - protocol
        - port_range
        - cidr
      properties:
        direction:
          type: string
          enum:
            - ingress
            - egress
        protocol:
          type: string
          enum:
            - tcp
            - udp
            - icmp
            - all
        port_range:
          type:
            - string
            - "null"
        cidr:
          type: string
    MigrationItemTarget:
      type: object
      description: "What the item becomes on Pantech; fields that don't apply to its kind are null or empty."
      required:
        - plan_slug
        - disk_gb
        - cidr
        - network_key
        - subnet_key
        - instance_key
        - rules
        - engine
        - engine_version
        - storage_gb
        - role
        - email
        - public_key
        - listeners
      properties:
        plan_slug:
          type:
            - string
            - "null"
        disk_gb:
          type:
            - integer
            - "null"
        cidr:
          type:
            - string
            - "null"
        network_key:
          type:
            - string
            - "null"
        subnet_key:
          type:
            - string
            - "null"
        instance_key:
          type:
            - string
            - "null"
        rules:
          type: array
          items:
            $ref: "#/components/schemas/MigrationRule"
        engine:
          type:
            - string
            - "null"
        engine_version:
          type:
            - string
            - "null"
        storage_gb:
          type:
            - integer
            - "null"
        role:
          type:
            - string
            - "null"
          enum:
            - admin
            - member
            - null
        email:
          type:
            - string
            - "null"
        public_key:
          type:
            - string
            - "null"
        listeners:
          type: array
          items:
            $ref: "#/components/schemas/MigrationListener"
    MigrationItemSource:
      type: object
      required:
        - id
        - name
        - region
        - summary
        - vcpu
        - memory_mib
        - disk_gb
      properties:
        id:
          type: string
        name:
          type:
            - string
            - "null"
        region:
          type:
            - string
            - "null"
        summary:
          type: string
        vcpu:
          type:
            - integer
            - "null"
        memory_mib:
          type:
            - integer
            - "null"
        disk_gb:
          type:
            - integer
            - "null"
    MigrationItem:
      type: object
      required:
        - key
        - kind
        - source
        - status
        - flags
        - target
      properties:
        key:
          type: string
          description: "Stable across edits: kind, region and the source id."
        kind:
          type: string
          enum:
            - network
            - subnet
            - security_group
            - instance
            - volume
            - public_ip
            - load_balancer
            - database
            - ssh_key
            - user
            - bucket
        source:
          $ref: "#/components/schemas/MigrationItemSource"
        status:
          type: string
          enum:
            - planned
            - excluded
            - unsupported
        flags:
          type: array
          items:
            $ref: "#/components/schemas/MigrationFlag"
        target:
          $ref: "#/components/schemas/MigrationItemTarget"
    MigrationEstimate:
      type:
        - object
        - "null"
      description: "Pantech's monthly price for the plan next to the source's monthly bill, computed when read."
      required:
        - currency
        - pantech_priced
        - pantech_monthly_minor
        - covers
        - not_covered
        - source_known
        - source_monthly_minor
        - source_currency
        - source_months
        - source_scope
      properties:
        currency:
          type: string
        pantech_priced:
          type: boolean
          description: "False when part of the plan could not be priced; then pantech_monthly_minor is null."
        pantech_monthly_minor:
          type:
            - integer
            - "null"
        covers:
          type: array
          items:
            type: string
          description: "What the Pantech price includes: servers, volumes, networks."
        not_covered:
          type: array
          items:
            type: string
          description: Planned items the price leaves out, e.g. databases.
        source_known:
          type: boolean
        source_monthly_minor:
          type:
            - integer
            - "null"
        source_currency:
          type:
            - string
            - "null"
        source_months:
          type: integer
        source_scope:
          type: string
          description: "`whole_account`: the source figure is the whole cloud bill."
          enum:
            - whole_account
    MigrationSummary:
      type: object
      required:
        - planned
        - excluded
        - unsupported
        - by_kind
      properties:
        planned:
          type: integer
        excluded:
          type: integer
        unsupported:
          type: integer
        by_kind:
          type: object
          description: Planned items per kind.
          additionalProperties:
            type: integer
    Migration:
      type: object
      required:
        - id
        - name
        - region
        - connection_id
        - scan_id
        - stage
        - version
        - summary
        - estimate
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: string
          examples:
            - mig_06gk3x9tq7m2v8r4y1c5d0zp8w
        name:
          type: string
        region:
          type: string
        connection_id:
          type: string
        scan_id:
          type: string
        stage:
          type: string
          description: "`planning`. Copying arrives in a later release."
          enum:
            - planning
        version:
          type: integer
        summary:
          $ref: "#/components/schemas/MigrationSummary"
        estimate:
          $ref: "#/components/schemas/MigrationEstimate"
        items:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/MigrationItem"
          description: Null in a list.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MigrationList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Migration"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    CreateMigrationRequest:
      type: object
      required:
        - scan_id
        - name
      properties:
        scan_id:
          type: string
        name:
          type: string
        region:
          type: string
          description: "A Pantech region code; the first region when left out."
    RenameMigrationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UpdateMigrationItemRequest:
      type: object
      required:
        - key
      properties:
        key:
          type: string
        excluded:
          type: boolean
        plan_slug:
          type: string
        storage_gb:
          type: integer
          minimum: 1
        cidr:
          type: string
        role:
          type: string
          enum:
            - member
            - admin
        email:
          type: string
    MigrationTerraform:
      type: object
      required:
        - files
      properties:
        files:
          type: array
          items:
            type: object
            required:
              - name
              - content
            properties:
              name:
                type: string
              content:
                type: string
