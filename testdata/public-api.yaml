          required:
            - secret
          properties:
            secret:
              type:
                - string
                - "null"
              description: "The signing secret (`whsec_…`). Shown only in this response; null when a create is replayed."
    WebhookList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Webhook"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
    CreateWebhookRequest:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          description: "An `https` URL on the public internet, at most 2,048 characters, with no user name or password."
          examples: ["https://example.com/hooks/pantech"]
        description:
          type: string
          description: "A note for yourself, at most 255 characters."
          examples: ["Production alerts"]
        events:
          type: array
          description: "1 to 100 entries: event types from `GET /webhook-event-types`, `<resource>.*`, or `*`."
          items:
            type: string
          examples: [["instance.*", "invoice.paid"]]
    UpdateWebhookRequest:
      type: object
      properties:
        url:
          type: string
          description: "A new `https` URL."
        description:
          type: string
          description: "A new note, at most 255 characters."
        events:
          type: array
          description: "The new subscriptions, replacing the old ones."
          items:
            type: string
        enabled:
          type: boolean
          description: "`false` stops deliveries; `true` resumes them and clears the failure history."
    WebhookDelivery:
      type: object
      description: "One event sent, or waiting to be sent, to one webhook."
      required:
        - id
        - webhook_id
        - event_id
        - event_type
        - status
        - attempts
        - next_attempt_at
        - last_attempt_at
        - last_status_code
        - last_error
        - last_response
        - last_duration_ms
        - delivered_at
        - created_at
      properties:
        id:
          type: string
          description: "e.g. `whd_...`."
        webhook_id:
          type: string
          description: "The webhook it is for."
        event_id:
          type: string
          description: "The event's `id`, the same in every delivery of it: deduplicate on it."
        event_type:
          type: string
          description: "e.g. `instance.created`."
        status:
          type: string
          description: "`pending` until it succeeds, fails eight times, or is cancelled because the webhook was disabled or deleted."
          enum:
            - pending
            - succeeded
            - failed
            - canceled
        attempts:
          type: integer
          description: "How many times it has been sent."
        next_attempt_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it is next sent, while `pending`."
        last_attempt_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it was last sent."
        last_status_code:
          type:
            - integer
            - "null"
          description: "The HTTP status your endpoint last answered; null if it did not answer."
        last_error:
          type:
            - string
            - "null"
          description: "Why the last attempt failed: `http_<status>`, `timeout`, `connection_failed`, `dns_failed`, `tls_failed`, `blocked_address` (the URL resolved to an address that is not on the public internet), `invalid_url`, `endpoint_disabled` or `endpoint_deleted`."
        last_response:
          type:
            - string
            - "null"
          description: "The first 1,024 characters of your endpoint's last response body."
        last_duration_ms:
          type:
            - integer
            - "null"
          description: "How long the last attempt took, in milliseconds."
        delivered_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When it succeeded."
        created_at:
          type: string
          format: date-time
          description: "When the event was queued for this webhook."
    WebhookDeliveryDetail:
      allOf:
