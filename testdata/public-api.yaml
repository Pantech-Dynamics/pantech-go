              schema:
                $ref: "#/components/schemas/Problem"
        422:
          description: |-
            `VALIDATION_FAILED`: a field is invalid. Each entry of `errors` names the `field` and its `code`:
            `name`, `public_ip_id`, `subnet_id` or `public_port` `REQUIRED`: send them.
            `public_port` `INVALID_LOAD_BALANCER`: `name` 1 to 63 characters, `algorithm` `roundrobin`, `leastconn` or `source`, ports 1 to 65535, and at most 20 IPv4 CIDRs in `cidr_list`.
