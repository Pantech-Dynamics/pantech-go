  /public/v1/kubernetes-clusters/{cluster_id}/apply-manifest:
    post:
      tags:
        - Kubernetes
      summary: Apply a manifest to a cluster
      description: |-
        Applies a YAML manifest (one or more documents, up to 512 KB and 100 objects) to the cluster with server-side apply, as `kubectl apply --server-side --force-conflicts` would, in order. Namespaced objects without a namespace go in `namespace` (default `default`). Applying the same manifest again changes nothing, so a retry is safe. If the cluster refuses an object, the objects before it stay applied and the error names the one it refused.

        Errors: `422 VALIDATION_FAILED` with `errors[].field = manifest` and code `INVALID_KUBERNETES_MANIFEST`, whose `message` is the cluster's own reason (for example a missing field); `404 KUBERNETES_CLUSTER_NOT_FOUND`; `409 KUBERNETES_CLUSTER_NOT_RUNNING`; `503 KUBERNETES_API_UNREACHABLE` (retry).
      operationId: applyKubernetesManifest
      security:
        - apiKey: []
      x-scope: write
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: {type: string, maxLength: 524288}
                namespace: {type: string, description: "Where namespaced objects without one go; default `default`."}
      responses:
        "200":
          description: What was applied.
          content:
            application/json:
              schema:
                type: object
                required: [applied, cluster_id, output, resources]
                properties:
                  applied: {type: boolean}
                  cluster_id: {type: string}
                  output: {type: string, description: "One line per object, as kubectl prints it.", examples: ["deployment.apps/web created"]}
                  resources:
                    type: array
                    items:
                      type: object
                      required: [kind, name, namespace, status]
                      properties:
                        kind: {type: string}
                        name: {type: string}
                        namespace: {type: string, description: "Empty for a cluster-wide object."}
                        status: {type: string, enum: [created, configured, unchanged]}
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: "`KUBERNETES_CLUSTER_NOT_FOUND`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "`KUBERNETES_CLUSTER_NOT_RUNNING`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: "`VALIDATION_FAILED`: `INVALID_KUBERNETES_MANIFEST` on `manifest`, or `REQUIRED`."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: "`KUBERNETES_API_UNREACHABLE`: retry."
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
