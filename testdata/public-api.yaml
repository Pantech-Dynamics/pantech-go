          description: "Pass as `cursor` for the next page; null on the last page."
    WebhookEvent:
      type: object
      description: |-
        The body of every delivery. An infrastructure event's `data` names the resource and the change: `resource_type`, `resource_id`, `operation_id`, `action`, `status` (`succeeded` or `failed`) and, on failure, `error` with the same safe `code` and `message` the operations API returns. Read the resource through the API for more. A billing event's `data` carries its amounts in minor units.
      properties:
        id:
          type: string
          description: "The event's id (`evt_…`). Deduplicate on it."
        type:
          type: string
          description: "e.g. `instance.created`, `invoice.paid`, `webhook.test`."
        api_version:
          type: string
          description: "The shape of this body, as a date: `2026-10-22`."
        created_at:
          type: string
          format: date-time
          description: "When it happened (RFC 3339, UTC)."
        organization_id:
          type: string
          description: "Your organization."
        project_id:
          type: string
          description: "The project (`acc_…`) the resource is in."
        data:
          type: object
          description: "What happened; depends on `type`."
    WebhookEventType:
      type: object
      required:
        - type
        - resource
        - description
      properties:
        type:
          type: string
          description: "e.g. `instance.created`."
        resource:
          type: string
          description: "What it is about, for `<resource>.*` subscriptions."
        description:
          type: string
          description: "What it means."
    WebhookEventTypeList:
      type: object
      required:
        - data
        - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebhookEventType"
        next_cursor:
          type:
            - string
            - "null"
          description: "Always null: this list is returned whole."
