    post:
      tags:
        - Security groups
      summary: Create a security group
      description: |-
        Creates a reusable firewall for standard instances in a security-group zone (`af-abj-1`). Each rule has a `direction`, a `protocol` (`tcp`, `udp`, `icmp` or `all`), a `port_range` for `tcp`/`udp` and one IPv4 `cidr`. Inbound traffic no rule allows is dropped. A group needs at least one rule.

        The name is unique among your live security groups; a deleted group frees its name. Attach the group to an instance at create (`security_group_id`) or with *Change an instance's security group*, or to a database as a source of allowed address ranges.

        Prefer narrow sources: a rule from `0.0.0.0/0` stops an instance from attaching a private database network interface.

        Returns `202 Accepted` with an `operation_id` (also in the `Location` header). The change happens in the background: poll `GET /public/v1/operations/{operation_id}`, or stream `/events`, until `status` is `succeeded` or `failed`; a failed operation carries a stable `failure.code` and a readable `failure.reason`. The group's id is the operation's `resource_id`.

        Send an `Idempotency-Key`. A retry with the same key returns the original operation instead of making the change twice.

        **Scope:** `write`.
      operationId: createSecurityGroup
      security:
        - apiKey: []
      x-scope: write
      x-order: 56
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityGroupRequest"
            examples:
              web:
                summary: "HTTPS from anywhere, SSH from one office address"
                value: {"name": "web", "rules": [{"direction": "ingress", "protocol": "tcp", "port_range": "443", "cidr": "0.0.0.0/0"}, {"direction": "ingress", "protocol": "tcp", "port_range": "22", "cidr": "203.0.113.4/32"}]}
              private_network_safe:
                summary: "Compatible with a private database network interface: no rule overlaps 10.250.0.0/20"
                value: {"name": "app", "rules": [{"direction": "ingress", "protocol": "tcp", "port_range": "443", "cidr": "203.0.113.0/24"}, {"direction": "ingress", "protocol": "icmp", "cidr": "198.51.100.0/24"}]}
      responses:
        202:
          description: "Accepted. Follow `operation_id` until it finishes."
          headers:
            RateLimit-Limit:
              description: Requests allowed per window for this key.
              schema:
                type: integer
            RateLimit-Remaining:
              description: Requests left in this window.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-Request-Id:
              description: "This request's id."
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
              examples:
                accepted:
                  summary: "Accepted; the new group's id is resource_id"
                  value: {"operation_id": "op_06gk3x9tq7m2v8r4y1c5d0zp8w", "resource_id": "sg_06gk3x9tq7m2v8r4y1c5d0zp8w", "status": "submitting"}
        400:
          description: |-
            `IDEMPOTENCY_KEY_REQUIRED`: the `Idempotency-Key` header is missing. Send a new unique value, such as a UUID, with every write.
            `INVALID_IDEMPOTENCY_KEY`: the `Idempotency-Key` header is longer than 255 characters. Use a shorter value.
            `INVALID_REQUEST_BODY`: the body is not a single valid JSON object. Send one JSON object with the fields documented for this endpoint.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        401:
          $ref: "#/components/responses/Unauthenticated"
        403:
          $ref: "#/components/responses/Forbidden"
        409:
          description: |-
            `SECURITY_GROUP_NAME_TAKEN`: you already have a security group with this name. Choose a different name.
            `SECURITY_GROUPS_NOT_SUPPORTED_IN_ZONE`: this zone uses VPC firewall rules, not security groups.
            `PROVIDER_ACCOUNT_NOT_READY`: your organization's cloud account is still being set up, which takes a few minutes after sign-up. Retry shortly.
            `CONCURRENT_UPDATE`: the resource changed while this request was being processed. Retry the request; if it repeats, read the resource first.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        413:
          description: |-
            `REQUEST_TOO_LARGE`: the body is larger than 64 KiB. Send a smaller request.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        422:
          description: |-
            `VALIDATION_FAILED`: a field is invalid. Each entry of `errors` names the `field` and its `code`:
            `name` `REQUIRED` or `NAME_TOO_LONG`: send a name of 1 to 255 characters.
            `UNKNOWN_FIELD`: the body has a field this endpoint does not take (named in `field`). Remove it or fix its spelling.
            `VALIDATION_FAILED` with no `errors` entry: the rule list is empty, or a rule has an unknown `direction` or `protocol` or an invalid IPv4 `cidr`. Send at least one valid rule.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        429:
          $ref: "#/components/responses/RateLimited"
        503:
          description: |-
            `SERVICE_UNAVAILABLE`: request quota storage is unavailable. Wait a few seconds, then retry.
            `PROVISIONING_UNAVAILABLE`: the provisioning service is temporarily unavailable. Wait a few seconds, then retry with the same `Idempotency-Key`.
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
