        - network_id
        - subnet_id
        - node_plan_id
        - node
        - control_nodes
        - workers
        - nodes
        - desired_state
        - observed_state
        - in_sync
        - failure_code
        - failure_reason
        - available_upgrades
        - autoscaling
        - api_allowed_cidrs
        - endpoint
        - volume_storage_gb
        - kind
        - cni_plugin
        - pod_cidr
        - service_cidr
        - endpoint_access
        - created_at
        - updated_at
      properties:
        id:
          type: string
          description: "e.g. `k8s_...`."
        name:
          type: string
        zone_id:
          type: string
        kubernetes_version_id:
          type: string
        kubernetes_version:
          type: string
          examples: ["1.31.2"]
        network_id:
          type:
            - string
            - "null"
          description: "The private network (VPC) the nodes are in; null in a standard zone."
        subnet_id:
          type:
            - string
            - "null"
        node_plan_id:
          type: string
        node:
          $ref: "#/components/schemas/KubernetesNode"
        control_nodes:
          type: integer
        workers:
          type: integer
        nodes:
          type: integer
          description: "control_nodes plus workers: the VMs billed."
        desired_state:
          type: string
          enum:
            - running
            - stopped
            - deleted
        observed_state:
          type: string
          description: "`updating` while a scale or upgrade runs."
          enum:
            - pending
            - provisioning
            - running
            - updating
            - stopping
            - stopped
            - retired
            - deleted
            - failed
            - unknown
        in_sync:
          type: boolean
          description: "False while a scale or upgrade has not finished."
        failure_code:
          type:
            - string
            - "null"
        failure_reason:
          type:
            - string
            - "null"
        available_upgrades:
          type: array
          description: "Versions this cluster can be upgraded to now. Empty for a cluster that runs the version it was created with, which is every cluster today."
          items:
            $ref: "#/components/schemas/KubernetesVersion"
        autoscaling:
          $ref: "#/components/schemas/KubernetesAutoscaling"
        api_allowed_cidrs:
          type: array
          description: "Sources allowed to reach the API server; empty is any address."
          items:
            type: string
        endpoint:
          type:
            - string
            - "null"
          description: "The API server's URL, once the cluster has one: the public address when the endpoint is public or dual and one is routed, else the private one."
        public_ip:
          type:
            - string
            - "null"
          description: "The public address the API server is reachable on; null until one is routed, and for a private endpoint."
          examples: ["203.0.113.20"]
        public_port:
          type:
            - integer
            - "null"
          description: "The public port the API server is reachable on; null until one is routed, and for a private endpoint."
          examples: [6443]
        node_health:
          type:
            - string
            - "null"
          enum: [healthy, degraded, unknown, null]
          description: "What Kubernetes last reported of the cluster's nodes while it runs: `healthy` (every node Ready), `degraded` (a node is NotReady, or fewer are Ready than the cluster should run) or `unknown` (the nodes could not be read in the last 15 minutes, for example a private endpoint whose agent is not connected). Read about every 5 minutes; null while the cluster is not running. Always `degraded`, with `node_health_reason`, while the cluster's pod or service range overlaps its own network."
          examples: ["healthy"]
        node_health_reason:
          type:
            - string
            - "null"
          description: "Why `node_health` is `degraded` when the cause is the cluster itself rather than a node's last reading: its `pod_cidr` or `service_cidr` overlaps the network its nodes are on (possible only for a cluster created before such ranges were refused). The ranges are fixed at creation, so the fix is a new cluster. Null otherwise."
        ready_nodes:
          type:
            - integer
            - "null"
          description: "Nodes Kubernetes reports Ready, as of `nodes_checked_at`; null when `node_health` is unknown or null."
          examples: [2]
        nodes_checked_at:
          type:
            - string
            - "null"
          format: date-time
          description: "When the nodes were last read; null if never."
        volume_storage_gb:
          type: integer
          description: "Storage your workloads' persistent volume claims use, billed with the nodes' disks."
        kind:
          type: string
          description: "Cluster architecture kind, e.g. `appliance`."
          examples: ["appliance"]
        cni_plugin:
          type: string
          description: "CNI backend plugin (`flannel`, `wireguard`, or `calico`)."
          examples: ["flannel"]
        pod_cidr:
          type: string
          description: "IPv4 CIDR range allocated for cluster pods."
          examples: ["10.42.0.0/16"]
        service_cidr:
          type: string
          description: "IPv4 CIDR range allocated for cluster services."
          examples: ["10.43.0.0/16"]
        endpoint_access:
          type: string
          description: "API server endpoint network access mode (`public`, `private`, or `dual`)."
          enum:
            - public
            - private
            - dual
          examples: ["public"]
        created_at:
          type:
            - string
            - "null"
          format: date-time
        updated_at:
          type:
            - string
            - "null"
          format: date-time
    KubernetesClusterList:
