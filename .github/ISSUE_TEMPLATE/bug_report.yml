name: Bug report
description: Something in the SDK does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens or other secrets.
        Security issues go to security@pantechdynamics.com, not here (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error output
      description: The full error, including the request id if there is one. Remove any secrets.
      render: text
  - type: input
    id: sdk-version
    attributes:
      label: SDK version
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: go version
      description: For example the output of `go version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
