name: Auto release

# A push to main that adds a new version heading to CHANGELOG.md publishes
# that version: this tags it and runs release.yml. Rename "## Unreleased" to
# the version (e.g. ## v0.2.0 — 2026-11-02) in the change you push, and bump
# Version in client.go to match. A push whose newest CHANGELOG version is
# already tagged releases nothing, so ordinary pushes are quiet. Pushing a tag
# by hand still releases as before.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version tag
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: version
        name: Tag the newest CHANGELOG version if it is new
        shell: bash
        run: |
          set -euo pipefail
          number=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+ ' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [ -z "$number" ]; then
            echo "No version heading in CHANGELOG.md; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="v$number"
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
          echo "Tagged $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.release == 'true'
    permissions:
      contents: write # publish the GitHub release
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.tag.outputs.version }}
